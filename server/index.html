<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Severino</title>
<style>
  :root { --bg:#0c1b32; --card:#152539; --card2:#1b2d45; --ink:#f5f7fa; --dim:#93a2ba;
          --accent:#ffc702; --green:#34c759; --amber:#ffb340; --red:#ff5147; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink);
              font:500 22px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:38px 56px 56px; }
  header { display:flex; align-items:center; gap:26px; margin-bottom:22px; }
  h1 { font-size:32px; font-weight:600; margin:0; display:flex; align-items:center; gap:12px; }
  h1 img { width:46px; height:46px; }
  .stats { flex:1; display:flex; gap:18px; flex-wrap:wrap; align-items:center; }
  .stat { min-width:132px; }
  .stat span { display:block; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .stat b { display:block; font-size:22px; font-weight:600; margin-top:2px; }
  .stat .bar { margin-top:6px; }
  .bar { height:8px; border-radius:4px; background:#ffffff18; overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:4px; background:var(--green); transition:width .4s; }
  .side { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .clock { font-size:44px; font-weight:300; letter-spacing:.02em; font-variant-numeric:tabular-nums; }
  .live { display:flex; align-items:center; gap:8px; font-size:15px; color:var(--dim);
          text-transform:uppercase; letter-spacing:.08em; }
  .live i { width:10px; height:10px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 #34c75988; animation:pulse 2s infinite; }
  .live.off i { background:var(--red); animation:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 #34c75988} 70%{box-shadow:0 0 0 9px #34c75900} 100%{box-shadow:0 0 0 0 #34c75900} }
  .alerts { display:flex; gap:12px; flex-wrap:wrap; }
  .chip { padding:8px 16px; border-radius:999px; font-size:17px; }
  .amber { background:#ffb34022; color:var(--amber); } .red { background:#ff514722; color:var(--red); }
  .tabs { display:flex; gap:12px; margin:0 0 20px; }
  .tab { padding:12px 26px; border-radius:12px; background:#ffffff0d; color:var(--dim);
         border:2px solid transparent; font-size:20px; cursor:pointer; }
  .tab.on { background:var(--accent); color:#0c1b32; border-color:var(--accent); font-weight:700; }
  .item { display:flex; align-items:center; gap:20px; padding:14px 20px; margin-bottom:10px;
          background:var(--card); border-radius:14px; border:2px solid transparent; }
  .item .t { flex:1; min-width:0; }
  .item .t b { font-weight:600; }
  .item .t small { display:block; color:var(--dim); font-size:16px; margin-top:2px; }
  .prog { height:8px; border-radius:4px; background:#ffffff18; margin-top:8px; max-width:420px; overflow:hidden; }
  .prog > i { display:block; height:100%; background:var(--accent); transition:width .4s; }
  .pill { font-size:15px; padding:5px 12px; border-radius:999px; background:#ffffff14; color:var(--dim); white-space:nowrap; }
  .pill.ok { background:#34c75922; color:var(--green); } .pill.wait { background:#ffb34022; color:var(--amber); }
  .pill.bad { background:#ff514722; color:var(--red); } .pill.dl { background:#ffc70222; color:var(--accent); }
  button.act { font:600 17px/1 inherit; padding:12px 18px; border-radius:10px; border:2px solid #ffffff26;
               background:#ffffff0f; color:var(--ink); cursor:pointer; min-width:190px; }
  button.act.danger { border-color:#ff514766; color:#ffb4ae; }
  button.act[data-ai] { border-color:#ffc70266; color:#ffc702; }
  :focus { outline:3px solid var(--accent); outline-offset:3px; }
  .item { background:var(--card); }
  .item:focus { background:var(--card2); }
  .holding { background:#ff514733 !important; }
  .empty { color:var(--dim); padding:26px 4px; }
  #toast { position:fixed; left:50%; bottom:44px; transform:translateX(-50%) translateY(24px);
           background:#1b2d45; border:2px solid #ffc70255; padding:16px 26px; border-radius:12px; opacity:0; transition:.2s; font-size:20px; }
  #toast.on { opacity:1; transform:translateX(-50%); }
</style>
</head>
<body>
<header>
  <h1><img src="/logo.png?v=3" alt="">Severino</h1>
  <div class="stats" id="stats"></div>
  <div class="alerts" id="alerts"></div>
  <div class="side">
    <div class="clock" id="clock">--:--</div>
    <div class="live" id="live"><i></i>ao vivo</div>
  </div>
</header>

<div class="tabs">
  <button class="tab on" data-tab="requests">Pedidos</button>
  <button class="tab" data-tab="library">Biblioteca</button>
  <button class="tab" data-tab="subs">Legendas</button>
</div>
<div id="list"></div>
<div id="toast"></div>

<script>
const TOKEN = "__PANEL_TOKEN__";
const H = { "X-Panel-Token": TOKEN, "Content-Type": "application/json" };
let tab = "requests", data = { requests: [], library: [], subs: [], recycle: { gb: 0 } }, eventsAt = 0, loading = false;

const $ = s => document.querySelector(s);
const fmt = gb => (gb >= 10 ? Math.round(gb) : (gb || 0).toFixed(1)) + " GB";
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600); }

function pill(state) {
  const s = (state || "").toLowerCase();
  const cls = /dispon|importado|ok/.test(s) ? "ok" : /baixando|procurando|importando|fila/.test(s) ? "dl"
            : /aprov/.test(s) ? "wait" : /recus|falh|erro/.test(s) ? "bad" : "";
  return `<span class="pill ${cls}">${state || "—"}</span>`;
}

async function load(force) {
  if (loading) return; loading = true;
  try {
    const o = await fetch("/overview", { cache: "no-store" }).then(r => r.json());
    renderHeader(o);
    $("#alerts").innerHTML = (o.alerts || []).map(a =>
      `<span class="chip ${a.level === "info" ? "amber" : a.level}">${a.text}</span>`).join("");
    live(true);
    data.requests = o.requests || [];
    data.recycle = o.recycle || { gb: 0 };
    const [lib, subs] = await Promise.all([
      fetch("/library", { cache: "no-store" }).then(r => r.json()),
      fetch("/subtitles", { cache: "no-store" }).then(r => r.json())]);
    data.library = lib.items || [];
    data.subs = subs.items || [];
    render(force);
  } catch (e) { live(false); }   // servidor fora: ícone fica vermelho, tela mantém o último estado
  loading = false;
}

function barColor(pct) {
  return pct >= 90 ? "var(--red)" : pct >= 80 ? "var(--amber)" : "var(--green)";
}
function ioRate(kbs) {   // escala automática: kB/s, MB/s ou GB/s
  if (kbs == null || isNaN(kbs)) return "—";
  if (kbs >= 1024 * 1024) return (kbs / 1048576).toFixed(1) + " GB/s";
  if (kbs >= 1024) {
    const mb = kbs / 1024;
    return (mb < 10 ? mb.toFixed(2) : mb.toFixed(1)) + " MB/s";
  }
  return Math.round(kbs) + " kB/s";
}
function tempColor(t) {
  return t >= 80 ? "var(--red)" : t >= 70 ? "var(--amber)" : "var(--ink)";
}
function renderHeader(o) {
  const d = o.disk || {}, h = o.host || {}, mem = h.mem || {}, cpu = h.cpu || {}, io = h.io || {};
  const cont = (h.containers || {}).running;
  const mb = (v) => (v / 1024).toFixed(1);
  const parts = [
    { label: "RAM", value: mem.total_mb ? `${mb(mem.used_mb)} / ${Math.round(mem.total_mb / 1024)} GB` : "—",
      pct: mem.pct },
    { label: "Disco", value: d.total_gb ? `${d.used_gb} / ${d.total_gb} GB` : "—", pct: d.pct },
    { label: "CPU", value: cpu.pct != null ? Math.round(cpu.pct) + "%" : "—" },
    { label: "Temp", value: h.temp_c != null ? Math.round(h.temp_c) + "°" : "—", color: h.temp_c != null ? tempColor(h.temp_c) : null },
    { label: "IO", value: io.read_kbs != null ? `↓${ioRate(io.read_kbs)} ↑${ioRate(io.write_kbs)}` : "—" },
    { label: "Contêineres", value: cont >= 0 ? String(cont) : "—" },
  ];
  $("#stats").innerHTML = parts.map(p => `
    <div class="stat"><span>${p.label}</span>
      <b style="${p.color ? "color:" + p.color : ""}">${p.value}</b>
      ${p.pct != null ? `<div class="bar"><i style="width:${Math.min(100, p.pct)}%;background:${barColor(p.pct)}"></i></div>` : ""}
    </div>`).join("");
}
function live(on) {
  const el = $("#live");
  el.classList.toggle("off", !on);
  el.lastChild.textContent = on ? "ao vivo" : "offline";
}
function tickClock() {
  const now = new Date();
  $("#clock").textContent = now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

let lastSig = "";
function render(force) {
  const sig = JSON.stringify([tab,
    data.requests.map(r => [r.id, r.state, r.pct, r.eta]),
    data.library.map(i => [i.id, i.watched, i.delete_in_days, i.size_gb]),
    data.subs.map(x => [x.id, x.ai, (x.subs || []).length]), data.recycle.gb]);
  if (!force && sig === lastSig) return;   // nada mudou: não re-renderiza (não rouba o foco)
  lastSig = sig;
  const keep = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fkey : null;
  const l = $("#list");
  if (tab === "requests") {
    l.innerHTML = data.requests.length ? data.requests.map(r => `
      <div class="item" tabindex="0" data-fkey="req-${r.id}">
        <div class="t"><b>${r.title}</b>
          <small>${r.type === "tv" ? "série" : "filme"}${r.sizeleft_gb ? " · faltam " + fmt(r.sizeleft_gb) : ""}${r.error ? " · " + r.error : ""}</small>
          ${r.pct != null ? `<div class="prog"><i style="width:${r.pct}%"></i></div>` : ""}
        </div>
        ${r.eta ? `<span class="pill dl">${r.eta}</span>` : ""}
        ${pill(r.state)}
      </div>`).join("") : `<div class="empty">nenhum pedido</div>`;
  } else if (tab === "library") {
    const bin = data.recycle && data.recycle.gb >= 1 ? `
      <div class="item" tabindex="0" data-fkey="bin">
        <div class="t"><b>Lixeira</b><small>${fmt(data.recycle.gb)} em arquivos excluídos — o espaço só volta ao esvaziar</small></div>
        <button class="act danger" data-fkey="purge" data-purge="1">Esvaziar</button>
      </div>` : "";
    l.innerHTML = bin + (data.library.length ? data.library.map(i => `
      <div class="item" tabindex="0" data-fkey="lib-${i.id}">
        <div class="t"><b>${i.title}</b>
          <small>${i.kind === "movie" ? "filme" : "série"} · ${i.year || ""}${
            i.watched ? ` · assistido há ${i.watched_days}d → sai em ${i.delete_in_days}d` : ""}</small></div>
        <span class="pill">${fmt(i.size_gb)}</span>
        <button class="act danger" data-fkey="del-${i.id}" data-kind="${i.kind}" data-id="${i.id}">Excluir</button>
      </div>`).join("") : `<div class="empty">biblioteca vazia</div>`);
  } else {
    l.innerHTML = data.subs.length ? data.subs.map(x => `
      <div class="item" tabindex="0" data-fkey="sub-${x.id}">
        <div class="t"><b>${x.title}</b>
          <small>${x.year || ""} · ${(x.subs || []).length ? (x.subs || []).join(" · ") : "sem legenda"}</small>
          ${x.ai ? `<small style="color:#34c759">legenda IA disponível</small>` : ""}</div>
        <button class="act" data-fkey="bz-${x.id}" data-sub="${x.id}">Buscar</button>
        <button class="act" data-fkey="ai-${x.id}" data-ai="${x.id}">${x.ai ? "Regenerar IA" : "Gerar IA"}</button>
      </div>`).join("") : `<div class="empty">nenhum filme com legenda no catálogo</div>`;
  }
  const again = keep ? document.querySelector(`[data-fkey="${keep}"]`) : null;
  (again || l.querySelector(".item") || document.querySelector(".tab.on")).focus();
}

// ---------- navegação ----------
function rows() {
  const r = [];
  const tabs = [...document.querySelectorAll(".tab")].filter(x => x.offsetParent);
  if (tabs.length) r.push(tabs);
  document.querySelectorAll(".item").forEach(it => {
    const row = [it];
    it.querySelectorAll("button.act").forEach(btn => { if (btn.offsetParent) row.push(btn); });
    r.push(row);
  });
  return r;
}
function nav(dir) {
  const rs = rows();
  let ri = rs.findIndex(x => x.includes(document.activeElement));
  if (ri < 0) { (rs[0] || [])[0]?.focus(); return; }
  const ci = rs[ri].indexOf(document.activeElement);
  let target = null;
  if (dir === "right" && ci < rs[ri].length - 1) target = rs[ri][ci + 1];
  else if (dir === "left" && ci > 0) target = rs[ri][ci - 1];
  else if (dir === "down") target = rs[ri + 1]?.[0];
  else if (dir === "up") target = rs[ri - 1]?.[0];
  if (!target) return;
  // Subindo para a barra de abas, o foco vai para a ABA ATIVA (não a primeira).
  if (dir === "up" && target.classList.contains("tab")) {
    target = document.querySelector(".tab.on") || target;
  }
  target.focus();
  // Na barra de abas volta ao topo (mostra o cabeçalho); nos itens, só o suficiente.
  if (target.classList.contains("tab")) window.scrollTo({ top: 0, behavior: "smooth" });
  else { try { target.scrollIntoView({ block: "nearest" }); } catch (e) {} }
}

// ---------- excluir/buscar: segurar OK 1,5 s OU OK duas vezes ----------
let holdTimer = null, holdEl = null, armed = null;
function press() {
  const el = document.activeElement;
  if (!el || !el.dataset || el.dataset.hold !== "1") return false;
  holdEl = el;
  el.classList.add("holding");
  holdTimer = setTimeout(() => { holdTimer = null; el.classList.remove("holding"); armOff(); run(el); }, 1500);
  return true;
}
function armOff() {
  if (armed) { armed.dataset.armed = ""; armed.textContent = armed.dataset.label; armed = null; }
}
function toggleArm(el) {
  if (armed === el) { armOff(); run(el); return; }
  armOff();
  armed = el;
  el.dataset.label = el.dataset.label || el.textContent;
  el.textContent = "OK de novo para confirmar";
  clearTimeout(el._arm);
  el._arm = setTimeout(() => { if (armed === el) armOff(); }, 5000);
}
function release() {
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  const el = holdEl;
  if (el) el.classList.remove("holding");
  holdEl = null;
  if (el) {                       // botão de segurar: solto cedo -> arma o duplo OK
    toggleArm(el);
    return;
  }
  const a = document.activeElement;
  if (!a) return;
  if (a.dataset && a.dataset.hold === "1") { toggleArm(a); return; }
  a.click();
}
function activate() { release(); }

async function run(el) {
  armOff();
  el.disabled = true;
  if (el.dataset.kind) {
    const kind = el.dataset.kind, id = Number(el.dataset.id);
    el.textContent = "excluindo…";
    try {
      const r = await fetch("/delete", { method: "POST", headers: H, body: JSON.stringify({ kind, id, files: true }) });
      if (!r.ok) throw new Error((await r.json()).error || r.status);
      toast("excluído — sinando Seerr/Jellyfin"); await load(true);
    } catch (e) { toast("erro: " + e.message); el.disabled = false; el.textContent = "Excluir"; }
  } else if (el.dataset.purge) {
    el.textContent = "esvaziando…";
    try {
      const r = await fetch("/recycle/purge", { method: "POST", headers: H, body: "{}" });
      if (!r.ok) throw new Error((await r.json()).error || r.status);
      const d = await r.json();
      toast("lixeira esvaziada — " + fmt(d.freed_gb) + " liberados"); await load();
    } catch (e) { toast("erro: " + e.message); el.disabled = false; el.textContent = "Esvaziar"; }
  } else if (el.dataset.ai) {
    const id = Number(el.dataset.ai);
    el.disabled = true; el.textContent = "IA 0%";
    try {
      const r = await fetch("/subtitles/ai", { method: "POST", headers: H, body: JSON.stringify({ id }) });
      if (!r.ok) throw new Error((await r.json()).error || r.status);
      const { job } = await r.json();
      toast("gerando legenda com IA…");
      const timer = setInterval(async () => {
        try {
          const j = await fetch(`/jobs/${job}`, { cache: "no-store" }).then(x => x.json());
          if (j.pct != null && el.isConnected) el.textContent = "IA " + j.pct + "%";
          if (j.state === "done") {
            clearInterval(timer);
            toast("legenda pronta: " + (j.cues || "") + " falas");
            el.disabled = false; el.textContent = "Gerar com IA"; load(true);
          } else if (j.state === "error") {
            clearInterval(timer);
            toast("falhou: " + (j.error || "").slice(0, 90));
            el.disabled = false; el.textContent = "Gerar com IA";
          }
        } catch (e) { /* segue tentando */ }
      }, 2000);
    } catch (e) { toast("erro: " + e.message); el.disabled = false; el.textContent = "Gerar com IA"; }
  } else if (el.dataset.sub) {
    el.textContent = "buscando…";
    try {
      const r = await fetch("/subtitles/search", { method: "POST", headers: H, body: JSON.stringify({ kind: "movie", id: Number(el.dataset.sub) }) });
      if (!r.ok) throw new Error((await r.json()).error || r.status);
      toast("busca de legenda enviada"); await load();
    } catch (e) { toast("erro: " + e.message); el.disabled = false; el.textContent = "Buscar"; }
  }
}

// A ponte do wrapper: DOWN do OK -> 'press', UP -> 'release' (ele não entrega keydown/keyup ao DOM).
window.__seerrNav = function (cmd) {
  try {
    if (cmd === "press") { return press() ? "hold" : "press"; }
    if (cmd === "release") { release(); return "release"; }
    if (cmd === "enter") { release(); return "click"; }          // compatibilidade
    // A página é única (abas), então BACK sempre sai — o wrapper pede a 2ª confirmação.
    if (cmd === "back") return "exit";
    nav(cmd); return "move";
  } catch (e) { return "err"; }
};

// Um toque: o wrapper entrega OK como click no key-up, então a ação roda direto.
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-ai],button[data-sub],button[data-kind],button[data-purge]");
  if (!b) return;
  run(b);
});

// Browsers (TV Bro) mandam keydown/keyup de verdade.
document.addEventListener("keydown", e => {
  const map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
  if (map[e.key]) { nav(map[e.key]); e.preventDefault(); return; }
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); press(); }
});
document.addEventListener("keyup", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); release(); }
});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  t.classList.add("on"); tab = t.dataset.tab; render(true);
});

// ---------- atualização ----------
async function pollEvents() {
  try {
    const d = await fetch(`/events?since=${eventsAt}`, { cache: "no-store" }).then(r => r.json());
    if (d.events && d.events.length) {
      eventsAt = d.now;
      const last = d.events[d.events.length - 1];
      toast(last.kind === "grab" ? "baixando: " + last.title : "disponível: " + last.title);
      load();
    }
  } catch (e) {}
}
load();
tickClock(); setInterval(tickClock, 1000);   // relógio local, não depende do fetch
setInterval(load, 2000);         // só os DADOS a cada 2 s (o relógio não é re-renderizado)
setInterval(pollEvents, 2000);   // webhook do Radarr/Sonarr -> reflexo em até 2 s
</script>
</body>
</html>
